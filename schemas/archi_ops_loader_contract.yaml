$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://slypilot.local/schemas/archi_ops_loader_contract.yaml"
title: "SlyPilot ARCHI OPS Context Selection Contract"
type: object
required:
  - input
  - output
  - context_profiles
  - algorithm_v1
  - constraints
  - index_health
properties:
  input:
    type: object
    required:
      - project_id
      - task_type
      - context_profile
      - intent_keywords
    properties:
      project_id:
        type: string
        minLength: 1
      task_type:
        type: string
        minLength: 1
      context_profile:
        type: string
        enum: [minimal, standard, premium]
      intent_keywords:
        type: array
        minItems: 0
        items:
          type: string
          minLength: 1
    additionalProperties: false
  output:
    type: object
    required:
      - files
      - maps
      - incident_cards
      - metadata
    properties:
      files:
        type: array
        items:
          type: object
          required:
            - path
            - reason
            - content
          properties:
            path:
              type: string
              minLength: 1
            reason:
              type: string
              minLength: 1
            content:
              type: string
              minLength: 1
          additionalProperties: false
      maps:
        type: array
        items:
          type: object
          required:
            - path
          properties:
            path:
              type: string
              minLength: 1
          additionalProperties: false
      incident_cards:
        type: array
        items:
          type: object
          required:
            - path
          properties:
            path:
              type: string
              minLength: 1
          additionalProperties: false
      metadata:
        type: object
        required:
          - total_tokens_estimated
          - files_selected
          - files_excluded
        properties:
          total_tokens_estimated:
            type: integer
            minimum: 0
          files_selected:
            type: integer
            minimum: 0
          files_excluded:
            type: integer
            minimum: 0
        additionalProperties: false
    additionalProperties: false
  context_profiles:
    type: object
    required:
      - minimal
      - standard
      - premium
    properties:
      minimal:
        type: object
        required:
          - max_files
          - max_lines
        properties:
          max_files:
            type: integer
            minimum: 1
            maximum: 3
          max_lines:
            type: integer
            minimum: 1
            maximum: 200
        additionalProperties: false
      standard:
        type: object
        required:
          - max_files
          - max_lines
        properties:
          max_files:
            type: integer
            minimum: 1
            maximum: 8
          max_lines:
            type: integer
            minimum: 1
            maximum: 500
        additionalProperties: false
      premium:
        type: object
        required:
          - max_files
          - max_lines
        properties:
          max_files:
            type: integer
            minimum: 1
            maximum: 15
          max_lines:
            type: integer
            minimum: 1
            maximum: 1000
        additionalProperties: false
    additionalProperties: false
  algorithm_v1:
    type: object
    required:
      - steps
    properties:
      steps:
        type: array
        minItems: 6
        maxItems: 6
        items:
          type: string
          enum:
            - read index
            - filter task_type
            - filter tags
            - sort weight
            - apply profile limits
            - return selection
    additionalProperties: false
  constraints:
    type: array
    minItems: 4
    uniqueItems: true
    items:
      type: string
      enum:
        - no_repo_scan
        - only_index_files
        - respect_context_profile
        - deterministic_selection
        - no_loader_code
        - no_embeddings
        - no_vector_db
        - no_similarity_search
        - no_dynamic_scoring
        - no_llm_selector
        - no_advanced_auto_routing
  index_health:
    type: object
    required:
      - stale_index_detection
      - stale_index_signaling
      - stale_index_maintenance
      - history_usage
    properties:
      stale_index_detection:
        type: array
        items:
          type: string
          minLength: 1
      stale_index_signaling:
        type: array
        items:
          type: string
          minLength: 1
      stale_index_maintenance:
        type: array
        items:
          type: string
          minLength: 1
      history_usage:
        type: object
        required:
          - enabled_for_counters
          - enabled_for_timestamps
        properties:
          enabled_for_counters:
            type: boolean
          enabled_for_timestamps:
            type: boolean
        additionalProperties: false
    additionalProperties: false
additionalProperties: false
