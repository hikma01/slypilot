$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://slypilot.local/schemas/task_packet.schema.yaml"
title: "SlyPilot Task Packet"
type: object
required:
  - metadata
  - task_type
  - input
  - context
  - constraints
  - negative_context
  - expected_output
  - validation
properties:
  metadata:
    type: object
    required:
      - packet_id
      - project
      - version
      - created_at
      - request_origin
      - estimated_raw_context_tokens
      - estimated_packet_tokens
      - context_reduction_ratio
      - round_trips
    properties:
      packet_id:
        type: string
        minLength: 1
      project:
        type: string
        const: slypilot
      version:
        type: string
        minLength: 1
      created_at:
        type: string
        minLength: 1
      request_origin:
        type: string
        enum: [cli, docs, test, review]
      estimated_raw_context_tokens:
        type: integer
        minimum: 0
      estimated_packet_tokens:
        type: integer
        minimum: 1
      context_reduction_ratio:
        type: number
        minimum: 1
      round_trips:
        type: integer
        minimum: 0
    additionalProperties: true
  task_type:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: string
      enum: [debug, patch, architecture, review, docs]
  input:
    type: object
    minProperties: 1
  context:
    type: object
    minProperties: 1
  constraints:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  negative_context:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  expected_output:
    type: object
    required:
      - response_type
    properties:
      response_type:
        type: string
        minLength: 1
      deliverable_type:
        type: string
        minLength: 1
      completion_criteria:
        type: array
        items:
          type: string
          minLength: 1
    additionalProperties: true
  validation:
    type: object
    required:
      - review_mode
      - reviewer
    properties:
      review_mode:
        type: string
        enum: [dry_run]
      reviewer:
        type: string
        enum: [human]
    additionalProperties: true
additionalProperties: true
